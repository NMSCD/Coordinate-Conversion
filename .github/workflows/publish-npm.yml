name: Publish

run-name: Publish NPM Package

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/**/*'
      - '!src/**/*.spec.*'

concurrency:
  group: 'publish'
  cancel-in-progress: true

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: Build Package
        run: |
          npm ci
          npm run build

      - name: Publish to NPM
        run: npm publish --access public
